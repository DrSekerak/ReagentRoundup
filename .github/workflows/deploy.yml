name: Validate server application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # CU Launch v1 supports npm install when no package-lock.json exists.
      - run: npm install
      - run: npm run validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
